name: Test and deploy Sentinel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock.txt
          npm ci --prefix frontend
      - name: Validate infrastructure templates
        run: |
          python -m venv /tmp/sentinel-lint
          /tmp/sentinel-lint/bin/python -m pip install cfn-lint==1.31.1
          /tmp/sentinel-lint/bin/cfn-lint infra/hosting.yaml infra/github-oidc.yaml
      - name: Backend and deployment tests
        run: .venv/bin/python -m pytest backend/tests -q
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        env:
          DATABASE_PATH: /tmp/sentinel-ci.db
        run: |
          .venv/bin/python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/sentinel-api.log 2>&1 &
          api_pid=$!
          npm run dev --prefix frontend -- --host 127.0.0.1 --strictPort > /tmp/sentinel-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/health; then
            cat /tmp/sentinel-api.log
            exit 1
          fi
          if ! curl --fail --retry 15 --retry-delay 1 --retry-connrefused --output /dev/null http://127.0.0.1:5173; then
            cat /tmp/sentinel-web.log
            exit 1
          fi
          npm run test:e2e --prefix frontend
          node frontend/tests/access.mjs
          node frontend/tests/api-errors.mjs

  deploy:
    name: Publish to AWS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_AUTO_DEPLOY != 'disabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: sentinel-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'sentinel-payments' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          EXECUTION_ROLE: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || 'arn:aws:iam::014679146311:role/sentinel-payments-cloudformation' }}
          RUNTIME_BOUNDARY: ${{ vars.AWS_RUNTIME_BOUNDARY_ARN || 'arn:aws:iam::014679146311:policy/sentinel-payments-runtime-boundary' }}
          WORKSPACE_KEY: ${{ secrets.SENTINEL_WORKSPACE_ACCESS_KEY || secrets.SECRET_KEY_1 }}
        run: |
          test -n "$EXECUTION_ROLE" || { echo '::error title=Missing infrastructure role::Configure AWS_CLOUDFORMATION_ROLE_ARN'; exit 1; }
          test -n "$RUNTIME_BOUNDARY" || { echo '::error title=Missing runtime boundary::Configure AWS_RUNTIME_BOUNDARY_ARN'; exit 1; }
          if [ -z "$WORKSPACE_KEY" ]; then
            echo '::error title=Workspace secret is unavailable::Add SENTINEL_WORKSPACE_ACCESS_KEY or SECRET_KEY_1 under repository Settings > Secrets and variables > Actions > Repository secrets. Environment secrets are not used by this workflow.'
            exit 1
          fi
          if [ "${#WORKSPACE_KEY}" -lt 24 ]; then
            echo '::error title=Workspace access key is too short::Update the workspace access key repository secret (SENTINEL_WORKSPACE_ACCESS_KEY or SECRET_KEY_1) to at least 24 characters. Do not put the value in a variable, workflow file, or chat.'
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Show non-secret OIDC identity metadata
        env:
          TARGET_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::014679146311:role/sentinel-payments-github-deployer' }}
        run: python3 scripts/oidc_identity.py
      - name: Build deployable application
        run: |
          python -m venv .venv
          bash scripts/package-cloudshell.sh
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::014679146311:role/sentinel-payments-github-deployer' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sentinel-${{ github.run_id }}
          role-duration-seconds: 3600
          retry-max-attempts: 2
      - name: Deploy and verify live website
        env:
          SENTINEL_WORKSPACE_ACCESS_KEY: ${{ secrets.SENTINEL_WORKSPACE_ACCESS_KEY || secrets.SECRET_KEY_1 }}
          EXECUTION_ROLE: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || 'arn:aws:iam::014679146311:role/sentinel-payments-cloudformation' }}
          RUNTIME_BOUNDARY: ${{ vars.AWS_RUNTIME_BOUNDARY_ARN || 'arn:aws:iam::014679146311:policy/sentinel-payments-runtime-boundary' }}
          FX_PROVIDER: ${{ vars.FX_PROVIDER || 'demo' }}
          FX_SECRET_ARN: ${{ vars.FX_SECRET_ARN }}
        run: |
          python3 .deploy/sentinel-cloudshell/deploy.py \
            --non-interactive \
            --region "$AWS_REGION" \
            --stack "$AWS_STACK_NAME" \
            --cloudformation-role-arn "$EXECUTION_ROLE" \
            --runtime-boundary-arn "$RUNTIME_BOUNDARY" \
            --fx-provider "$FX_PROVIDER" \
            --fx-secret-arn "$FX_SECRET_ARN"
      - name: Publish website link to run summary
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = json.loads(Path('.deploy/sentinel-cloudshell/deployment-output.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Sentinel deployment verified\n\n')
              summary.write('Website: ' + output['SiteUrl'] + '\n\n')
              summary.write('Region: ' + output['region'] + '\n')
          PY
      - name: Save non-secret deployment outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-deployment-outputs
          path: .deploy/sentinel-cloudshell/deployment-output.json
          include-hidden-files: true
          retention-days: 7
